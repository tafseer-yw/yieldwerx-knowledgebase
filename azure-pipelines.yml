trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

steps:
  - checkout: self
    lfs: true

  - task: NodeTool@0
    inputs:
      versionSpec: "22.x"
    displayName: Use Node.js 22

  - script: npm run format:check
    displayName: Check formatting

  - script: npm test
    displayName: Validate knowledgebase
